<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VFX Breakdown Slider</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }

        /* The main container holding everything */
        .comparison-slider {
            position: relative;
            width: 100%;
            max-width: 800px;
            /* Adjust this to match your GIF width */
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Style for both images */
        .comparison-slider img {
            display: block;
            width: 100%;
            height: auto;
            user-select: none;
            pointer-events: none;
            /* Prevents dragging the image itself */
        }

        /* The post-VFX image stays in the background */
        .img-after {
            position: relative;
        }

        /* The green screen image sits on top and gets clipped */
        .img-before {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Initially clip the right half of the image */
            clip-path: inset(0 50% 0 0);
        }

        /* The invisible range slider that captures mouse/touch movement */
        .slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            /* Invisible, but captures events */
            cursor: ew-resize;
            /* Left-right arrow cursor */
            z-index: 10;
            margin: 0;
        }

        /* The visible white line */
        .slider-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            /* Starts at middle */
            width: 4px;
            background-color: white;
            transform: translateX(-50%);
            pointer-events: none;
            /* Let clicks pass through to the invisible slider */
            z-index: 5;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        /* The circle handle in the middle of the line */
        .slider-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The little arrows inside the button */
        .slider-button::before,
        .slider-button::after {
            content: '';
            border: solid #333;
            border-width: 0 3px 3px 0;
            display: inline-block;
            padding: 4px;
        }

        .slider-button::before {
            transform: rotate(135deg);
            margin-right: 4px;
        }

        .slider-button::after {
            transform: rotate(-45deg);
            margin-left: 4px;
        }
    </style>
</head>

<body>

    <div class="comparison-slider">
        <img class="img-after" src="greenscreen-vfx.gif" alt="Post VFX Scene">

        <img class="img-before" src="greenscreen.gif" alt="Green Screen Scene">

        <input type="range" min="0" max="100" value="50" class="slider" id="vfxSlider">

        <div class="slider-line" id="sliderLine"></div>
        <div class="slider-button" id="sliderButton"></div>
    </div>

    <script>
        const slider = document.getElementById('vfxSlider');
        const imgBefore = document.querySelector('.img-before');
        const sliderLine = document.getElementById('sliderLine');
        const sliderButton = document.getElementById('sliderButton');

        // Whenever the slider moves, update the clip-path and line position
        slider.addEventListener('input', (e) => {
            const sliderValue = e.target.value;

            // Calculate how much of the right side to cut off
            // If slider is at 20%, we cut off the right 80% of the top image
            const clipValue = 100 - sliderValue;

            // Apply the new styles
            imgBefore.style.clipPath = `inset(0 ${clipValue}% 0 0)`;
            sliderLine.style.left = `${sliderValue}%`;
            sliderButton.style.left = `${sliderValue}%`;
        });
    </script>

</body>

</html>
